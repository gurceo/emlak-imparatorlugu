<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emlak İmparatorluğu | Sosyal</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:0;padding:20px}main{max-width:480px;margin:auto}section{background:#202d39;padding:20px;border-radius:16px;margin:15px 0}input,button,textarea{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #52616c;background:#101923;color:white;font:inherit}button{background:#c9a65b;color:#101923;font-weight:bold}a{color:#e5c47d}label{display:block}input[type=checkbox]{width:auto}small{color:#c6cbd1} [hidden]{display:none!important}body{padding:12px 12px 82px}main>h1{font-size:20px;margin:8px 0}main>p{font-size:12px}section{padding:14px;margin:8px 0}h2{font-size:19px;margin:8px 0}button{padding:10px}#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#17232f;padding:8px;z-index:10;gap:6px}#tabs button{font-size:13px;background:#263746;color:#eee;margin:0}#tabs button.active{background:#c9a65b;color:#101923}#friendlist>div,#results>p{padding:12px;border-bottom:1px solid #52616c}#friendlist button,#results button{width:auto;font-size:12px;margin:4px}#chat{position:fixed;inset:0 0 64px;z-index:12;margin:0;border-radius:0;display:flex;flex-direction:column}#thread{flex:1;max-height:none!important}#sendform{display:flex;gap:6px}#sendform button{width:auto}#msg{bottom:76px!important}</style><main><a href="3d.html">← Şehre dön</a><h1>Emlak İmparatorluğu</h1><p>Sosyal Dünya • Kapalı test</p><p id="msg" role="status"></p><section id="auth"><h2>Oyuncu hesabı</h2><input id="email" type="email" placeholder="E-posta" autocomplete="email"><input id="pass" type="password" placeholder="Şifre (en az 8 karakter)" autocomplete="current-password"><button id="login">Giriş yap</button><button id="signup">Hesap oluştur</button></section><section id="profile" hidden><h2>Profilim</h2><form id="pf"><label>Oyuncu adı<input name="username" required maxlength="40"></label><label>Ad soyad (isteğe bağlı)<input name="full_name" maxlength="80"></label><label>Şirket<input name="company_name" maxlength="80"></label><label>Şehir<input name="city" maxlength="60"></label><label>Meslek<input name="profession" maxlength="80"></label><label>Hakkımda<textarea name="bio" maxlength="500"></textarea></label><label><input name="discoverable" type="checkbox"> Profilimi diğer oyunculara göster</label><small>Görünür profil bilgilerin giriş yapan diğer oyuncular tarafından okunabilir.</small><button>Profili kaydet</button></form><button id="logout">Çıkış yap</button></section><section id="people" hidden><div id="discoverpane"><h2>Oyuncuları keşfet</h2><input id="search" placeholder="Oyuncu, şehir veya meslek"><button id="find">Ara</button><div id="results"></div></div><div id="friendpane"><h2>Mesajlar ve arkadaşlar</h2><button id="friends">Arkadaşlıkları yenile</button><div id="friendlist"></div></div><div id="blockpane"><h2>Engellenen oyuncular</h2><button id="blocked">Listeyi yenile</button><div id="blocklist"></div></div><section id="chat" hidden><h2 id="chatname">Mesajlar</h2><div id="thread" style="max-height:320px;overflow:auto"></div><form id="sendform"><input id="body" maxlength="2000" required placeholder="Mesaj yaz"><button>Gönder</button></form><button id="closechat">Sohbeti kapat</button></section></section><nav id="tabs" hidden><button data-tab="friends">💬 Mesajlar</button><button data-tab="discover">🔎 Keşfet</button><button data-tab="profile">👤 Profil</button></nav></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://zrxacsgxysfjoqwbwrud.supabase.co','sb_publishable_M_9lHNCbzKEyrsHe3-h0Ag_ZT6itiMW');const $=id=>document.getElementById(id);let user;function say(t){$('msg').textContent=t;$('msg').style.cssText='position:fixed;bottom:12px;left:12px;right:12px;z-index:999;background:#263746;color:white;padding:16px;border:1px solid #c9a65b;border-radius:10px;overflow-wrap:anywhere';}function check(r){if(r.error)throw r.error;return r.data}function action(fn){return async e=>{e?.preventDefault();try{await fn()}catch(err){say(err.message||'İşlem başarısız')}}}async function refresh(){user=check(await db.auth.getSession()).session?.user;$('auth').hidden=!!user;$('profile').hidden=!user;$('people').hidden=true;if(!user)return;const p=check(await db.from('profiles').select('*').eq('id',user.id).maybeSingle());if(p){for(const k of ['username','full_name','company_name','city','profession','bio'])$('pf').elements[k].value=p[k]||'';$('pf').elements.discoverable.checked=p.discoverable;$('people').hidden=false}}$('login').onclick=action(async()=>{check(await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value}));await refresh();say('Giriş başarılı')});$('signup').onclick=action(async()=>{if($('pass').value.length<8)throw Error('Şifre en az 8 karakter olmalı');const r=check(await db.auth.signUp({email:$('email').value,password:$('pass').value,options:{emailRedirectTo:location.origin+'/social.html'}}));await refresh();say(r.session?'Hesap oluşturuldu':'E-postana gelen doğrulama bağlantısını aç.')});$('logout').onclick=action(async()=>{check(await db.auth.signOut());$('pf').reset();$('results').replaceChildren();await refresh();say('Çıkış yapıldı')});$('pf').onsubmit=action(async()=>{const f=new FormData($('pf'));const p={id:user.id,discoverable:f.has('discoverable')};for(const k of ['username','full_name','company_name','city','profession','bio'])p[k]=String(f.get(k)||'').trim();if(!p.username)throw Error('Oyuncu adı gerekli');say('Profil kaydediliyor…');check(await db.from('profiles').upsert(p,{onConflict:'id'}));await refresh();say('Profil kaydedildi')});$('find').onclick=action(async()=>{const rows=check(await db.from('profiles').select('id,username,city,profession,company_name').eq('discoverable',true).neq('id',user.id).limit(100));const q=$('search').value.toLocaleLowerCase('tr');$('results').replaceChildren();for(const p of rows.filter(p=>[p.username,p.city,p.profession,p.company_name].join(' ').toLocaleLowerCase('tr').includes(q))){const d=document.createElement('p');d.textContent=[p.username,p.city,p.profession,p.company_name].filter(Boolean).join(' · ');const b=document.createElement('button');b.textContent='Arkadaşlık isteği gönder';b.onclick=action(async()=>{check(await db.from('friendships').insert({sender_id:user.id,receiver_id:p.id}));say('İstek gönderildi');b.disabled=true});d.append(b);safety(d,p.id);$('results').append(d)}if(!$('results').children.length)$('results').textContent='Oyuncu bulunamadı.'});$('friends').onclick=action(async()=>{const rows=check(await db.from('friendships').select('*').order('created_at',{ascending:false}));$('friendlist').replaceChildren();for(const f of rows){const other=f.sender_id===user.id?f.receiver_id:f.sender_id;const p=check(await db.from('profiles').select('username,city,profession').eq('id',other).maybeSingle());const d=document.createElement('div');d.textContent=(p?.username||'Gizli profil')+' · '+({pending:'Bekliyor',accepted:'Arkadaş',rejected:'Reddedildi'}[f.status]);function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=action(async()=>{await fn();if(label!=='Mesajlaş')$('friends').click()});d.append(b)}if(f.status==='pending'&&f.receiver_id===user.id){for(const [label,status] of [['Kabul et','accepted'],['Reddet','rejected']])btn(label,async()=>check(await db.from('friendships').update({status}).eq('id',f.id)))}if(f.status==='accepted')btn('Mesajlaş',async()=>openChat(other,p?.username||'Arkadaş'));btn('Kaldır',async()=>check(await db.from('friendships').delete().eq('id',f.id)));safety(d,other);$('friendlist').append(d)}if(!rows.length)$('friendlist').textContent='Henüz arkadaşlık yok.'});let peer=null,channel=null;async function closeChat(){peer=null;$('chat').hidden=true;$('thread').replaceChildren();$('body').value='';if(channel){await db.removeChannel(channel);channel=null}}async function loadChat(){const target=peer;if(!target||!user)return;const rows=check(await db.from('messages').select('id,sender_id,receiver_id,body,created_at').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+target+'),and(sender_id.eq.'+target+',receiver_id.eq.'+user.id+')').order('created_at',{ascending:false}).limit(100));if(peer!==target)return;$('thread').replaceChildren();for(const m of rows.reverse()){const d=document.createElement('p');d.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border-radius:8px;background:'+(m.sender_id===user.id?'#42553d':'#354554');d.textContent=(m.sender_id===user.id?'Sen: ':'')+m.body;$('thread').append(d)}$('thread').scrollTop=$('thread').scrollHeight}async function openChat(id,name){await closeChat();peer=id;$('chatname').textContent=name+' · Mesajlar';$('chat').hidden=false;await loadChat();channel=db.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver_id=eq.'+user.id},()=>action(loadChat)()).subscribe();$('chat').scrollIntoView({behavior:'smooth'})}$('sendform').onsubmit=action(async()=>{if(!peer||!user)return;const body=$('body').value.trim();if(!body)return;check(await db.from('messages').insert({sender_id:user.id,receiver_id:peer,body}));$('body').value='';await loadChat()});$('closechat').onclick=action(closeChat);$('logout').addEventListener('click',()=>closeChat());function safety(d,id){for(const [label,fn] of [['Engelle',async()=>{if(!confirm('Bu oyuncu engellensin mi?'))return;check(await db.from('blocks').insert({blocker_id:user.id,blocked_id:id}));if(peer===id)await closeChat();say('Oyuncu engellendi');$('blocked').click()}],['Şikâyet et',async()=>{const reason=prompt('Sebep: 1 Taciz, 2 Spam, 3 Dolandırıcılık, 4 Uygunsuz içerik, 5 Diğer');const code={'1':'harassment','2':'spam','3':'fraud','4':'inappropriate','5':'other'}[reason];if(!code)return;const details=prompt('Açıklama (isteğe bağlı)');if(details===null)return;check(await db.from('reports').insert({reporter_id:user.id,reported_id:id,reason:code,details:details.slice(0,2000)}));say('Şikâyet kaydedildi')} ]]){const b=document.createElement('button');b.textContent=label;b.onclick=action(fn);d.append(b)}}$('blocked').onclick=action(async()=>{const rows=check(await db.from('blocks').select('blocked_id').eq('blocker_id',user.id));$('blocklist').replaceChildren();for(const row of rows){const p=check(await db.from('profiles').select('username').eq('id',row.blocked_id).maybeSingle());const d=document.createElement('p');d.textContent=p?.username||'Gizli profil';const b=document.createElement('button');b.textContent='Engeli kaldır';b.onclick=action(async()=>{check(await db.from('blocks').delete().eq('blocker_id',user.id).eq('blocked_id',row.blocked_id));$('blocked').click()});d.append(b);$('blocklist').append(d)}if(!rows.length)$('blocklist').textContent='Engellenen oyuncu yok.'});let tab='friends';function showTab(t){tab=t;const logged=!!user;const ready=logged&&!$('people').dataset.notready;$('tabs').hidden=!ready;$('profile').hidden=!logged||(ready&&t!=='profile');$('people').hidden=!ready;$('friendpane').hidden=t!=='friends';$('discoverpane').hidden=t!=='discover';$('blockpane').hidden=t!=='profile';$('people').hidden=!ready||t==='profile';if(ready&&t==='profile'){$('people').hidden=false;$('blocked').click()}document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(ready&&t==='friends')$('friends').click();if(ready&&t==='discover')$('find').click()}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{closeChat();showTab(b.dataset.tab)});const originalRefresh=refresh;refresh=async()=>{await originalRefresh();$('people').dataset.notready=$('people').hidden?'1':'';showTab(tab)};if(new URLSearchParams(location.search).has('embedded')){document.querySelector('main>a').hidden=true;document.querySelector('main>h1').hidden=true;document.querySelector('main>p').hidden=true}action(refresh)();</script></html>
