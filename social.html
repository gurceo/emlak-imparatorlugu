<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emlak İmparatorluğu | Sosyal</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:0;padding:20px}main{max-width:480px;margin:auto}section{background:#202d39;padding:20px;border-radius:16px;margin:15px 0}input,button,textarea{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #52616c;background:#101923;color:white;font:inherit}button{background:#c9a65b;color:#101923;font-weight:bold}a{color:#e5c47d}label{display:block}input[type=checkbox]{width:auto}small{color:#c6cbd1} [hidden]{display:none!important}</style><main><a href="3d.html">← Şehre dön</a><h1>Emlak İmparatorluğu</h1><p>Sosyal Dünya • Kapalı test</p><p id="msg" role="status"></p><section id="auth"><h2>Oyuncu hesabı</h2><input id="email" type="email" placeholder="E-posta" autocomplete="email"><input id="pass" type="password" placeholder="Şifre (en az 8 karakter)" autocomplete="current-password"><button id="login">Giriş yap</button><button id="signup">Hesap oluştur</button></section><section id="profile" hidden><h2>Profilim</h2><form id="pf"><label>Oyuncu adı<input name="username" required maxlength="40"></label><label>Ad soyad (isteğe bağlı)<input name="full_name" maxlength="80"></label><label>Şirket<input name="company_name" maxlength="80"></label><label>Şehir<input name="city" maxlength="60"></label><label>Meslek<input name="profession" maxlength="80"></label><label>Hakkımda<textarea name="bio" maxlength="500"></textarea></label><label><input name="discoverable" type="checkbox"> Profilimi diğer oyunculara göster</label><small>Görünür profil bilgilerin giriş yapan diğer oyuncular tarafından okunabilir.</small><button>Profili kaydet</button></form><button id="logout">Çıkış yap</button></section><section id="people" hidden><h2>Oyuncuları keşfet</h2><input id="search" placeholder="Oyuncu, şehir veya meslek"><button id="find">Ara</button><div id="results"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://zrxacsgxysfjoqwbwrud.supabase.co','sb_publishable_M_9lHNCbzKEyrsHe3-h0Ag_ZT6itiMW');const $=id=>document.getElementById(id);let user;function say(t){$('msg').textContent=t}function check(r){if(r.error)throw r.error;return r.data}function action(fn){return async e=>{e?.preventDefault();try{await fn()}catch(err){say(err.message||'İşlem başarısız')}}}async function refresh(){user=check(await db.auth.getSession()).session?.user;$('auth').hidden=!!user;$('profile').hidden=!user;$('people').hidden=true;if(!user)return;const p=check(await db.from('profiles').select('*').eq('id',user.id).maybeSingle());if(p){for(const k of ['username','full_name','company_name','city','profession','bio'])$('pf').elements[k].value=p[k]||'';$('pf').elements.discoverable.checked=p.discoverable;$('people').hidden=false}}$('login').onclick=action(async()=>{check(await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value}));await refresh();say('Giriş başarılı')});$('signup').onclick=action(async()=>{if($('pass').value.length<8)throw Error('Şifre en az 8 karakter olmalı');const r=check(await db.auth.signUp({email:$('email').value,password:$('pass').value,options:{emailRedirectTo:location.origin+'/social.html'}}));await refresh();say(r.session?'Hesap oluşturuldu':'E-postana gelen doğrulama bağlantısını aç.')});$('logout').onclick=action(async()=>{check(await db.auth.signOut());$('pf').reset();$('results').replaceChildren();await refresh();say('Çıkış yapıldı')});$('pf').onsubmit=action(async()=>{const f=new FormData($('pf'));const p={id:user.id,discoverable:f.has('discoverable')};for(const k of ['username','full_name','company_name','city','profession','bio'])p[k]=String(f.get(k)||'').trim();if(!p.username)throw Error('Oyuncu adı gerekli');check(await db.from('profiles').upsert(p));await refresh();say('Profil kaydedildi')});$('find').onclick=action(async()=>{const rows=check(await db.from('profiles').select('id,username,city,profession,company_name').eq('discoverable',true).neq('id',user.id).limit(100));const q=$('search').value.toLocaleLowerCase('tr');$('results').replaceChildren();for(const p of rows.filter(p=>[p.username,p.city,p.profession,p.company_name].join(' ').toLocaleLowerCase('tr').includes(q))){const d=document.createElement('p');d.textContent=[p.username,p.city,p.profession,p.company_name].filter(Boolean).join(' · ');$('results').append(d)}if(!$('results').children.length)$('results').textContent='Oyuncu bulunamadı.'});action(refresh)();</script></html>
