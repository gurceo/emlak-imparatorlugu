<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emlak İmparatorluğu</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f2e9;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{color:#dfbd77}section,article{background:#202d37;border:1px solid #40505b;border-radius:14px;padding:16px;margin:12px 0}button{background:#dfbd77;color:#101820;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}button:disabled{opacity:.4}small{color:#c4cbd0}h3{margin:4px 0}header{padding:18px 0}h1{font-size:30px;letter-spacing:-1px;margin-bottom:4px}#stats{background:linear-gradient(135deg,#33454e,#17232c)}#stats h2{font-size:34px;margin:10px 0}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{flex:1}article{border-left:3px solid #dfbd77}button{min-height:44px}#notice{position:sticky;bottom:0;background:#17232c;padding:12px;border-radius:8px} .muted{color:#b6c3cc}nav{display:grid;grid-template-columns:repeat(3,1fr)}nav button{margin:2px} .citygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.district{background:#263943;border-radius:10px;padding:12px}.building{height:110px;background:linear-gradient(#7997a8,#c6d5d8);overflow:hidden;position:relative;border-radius:8px;margin-bottom:10px}.building svg{width:100%;height:100%}progress{width:100%;accent-color:#dfbd77}body{background:radial-gradient(ellipse at top,#30434a,#101820 65%)}main{padding-bottom:115px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,650px);z-index:10;background:#15232c;padding:8px 10px max(8px,env(safe-area-inset-bottom));border-top:1px solid #ac9058;grid-template-columns:repeat(4,1fr)}nav button{background:#263842;color:#f4dfad;font-size:12px;padding:7px;min-height:45px}nav button.active{background:#dfbd77;color:#101820}#notice{position:static}#hero{height:135px;border-radius:14px;overflow:hidden;background:linear-gradient(#527c93,#c6a77e);margin:14px 0}#hero svg{width:100%;height:100%}.mission{border-bottom:1px solid #40505b;padding:10px 0}.mission:last-child{border:0}#news{font-size:14px;color:#dfbd77}button:focus-visible{outline:3px solid white}</style><main><h1>Emlak İmparatorluğu</h1><small>İSTANBUL • V0.5</small><div id="hero" aria-label="Şematik İstanbul silüeti"><svg viewBox="0 0 600 140" preserveAspectRatio="xMidYMid slice"><circle cx="490" cy="28" r="19" fill="#f7db9b"/><path d="M0 115L600 105V140H0Z" fill="#426b7e"/><g fill="#31454d"><path d="M0 100V65H38V100H55V38H95V100H110V52H150V100H170V22H207V100H225V60H265V100H280V40H320V100H340V75H380V100H400V48H440V100H460V65H500V100H520V30H555V100H600V110H0Z"/><path d="M350 75V55Q370 25 390 55V75M340 75V20H345V75M395 75V15H400V75"/></g><path d="M0 112Q150 98 300 112T600 112" stroke="#b8cbd0" fill="none"/></svg></div><section id="stats"></section><button onclick="advance()">Sonraki ay</button><button onclick="resetGame()">Yeni oyun</button><div id="news" role="status"></div><nav><button onclick="tab('tasksView')">★ Görevler</button><button onclick="tab('cityView')">Şehir</button><button onclick="tab('buildView')">İnşaat</button><button onclick="tab('marketView')">Piyasa</button><button onclick="tab('portfolioView')">Portföy</button><button onclick="tab('officeView')">Ofis</button><button onclick="tab('bankView')">Banka</button></nav><div id="tasksView" hidden><h2>Kariyer görevleri</h2><section id="tasks"></section><section id="daily"></section></div><div id="cityView" hidden><h2>İstanbul yatırım bölgeleri</h2><section id="city"></section></div><div id="buildView" hidden><h2>İnşaat projeleri</h2><section id="build"></section><section id="partners"></section></div><div id="officeView" hidden><h2>Emlak ofisi</h2><section id="office"></section><section id="company"></section></div><div id="bankView" hidden><h2>Banka</h2><section id="bank"></section></div><div id="marketView"><h2>Satılık mülkler</h2><div id="market"></div></div><div id="portfolioView" hidden><h2>Portföyüm</h2><div id="portfolio"></div></div><p id="notice" role="status"></p></main><script>const base=[{id:1,name:'Esenyurt • Stüdyo',price:320000,rent:4200},{id:2,name:'Silivri • Arsa',price:450000,rent:0},{id:3,name:'Pendik • 1+1',price:480000,rent:6200},{id:4,name:'Kadıköy • 2+1',price:1800000,rent:19000}];const fresh=()=>({cash:500000,month:1,owned:[],market:base.map(p=>({...p})),notice:'',debt:0,office:0,deals:0,lastDeal:0});let s;try{s=JSON.parse(localStorage.getItem('emlak-v1'))||fresh()}catch(e){s=fresh()}function migrate(){s.staff??=0;s.partners??=[];s.dailyClaim??=0;s.xp??=0;s.claimed??=[];s.news??='İstanbul yatırım piyasasına hoş geldin.';s.projects??=[];s.debt??=0;s.office??=0;s.deals??=0;s.lastDeal??=0;for(const p of [{id:5,name:'Beylikdüzü • 2+1',price:950000,rent:11000},{id:6,name:'Şişli • Ofis',price:2400000,rent:28000},{id:7,name:'Çatalca • Arsa',price:650000,rent:0}])if(!s.market.some(x=>x.id===p.id))s.market.push(p)}migrate();const tl=n=>Math.round(n).toLocaleString('tr-TR')+' TL';function building(p){const land=!p.rent;return '<div class="building"><svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid slice"><rect y="85" width="300" height="25" fill="#64826a"/>'+ (land?'<path d="M40 94 L130 55 L260 78 L170 108 Z" fill="#b9a17b" stroke="#f0d69d" stroke-width="3"/>':'<path d="M80 90V20L190 8V90Z" fill="#e0d8c9"/><path d="M190 8L235 30V90H190Z" fill="#929b9d"/>'+Array.from({length:12},(_,i)=>'<rect x="'+(91+i%4*24)+'" y="'+(25+Math.floor(i/4)*20)+'" width="15" height="12" fill="#425e70"/>').join(''))+'</svg></div>'}function draw(){migrate();localStorage.setItem('emlak-v1',JSON.stringify(s));const assets=s.owned.reduce((a,o)=>a+s.market.find(p=>p.id===o.id).price,0);const income=s.owned.reduce((a,o)=>a+(o.leased?s.market.find(p=>p.id===o.id).rent:0),0);document.getElementById('stats').innerHTML='Ay '+s.month+'<h2>'+tl(s.cash)+'</h2>Nakit • Net varlık: '+tl(s.cash+assets-s.debt+s.projects.reduce((a,p)=>a+p.cost,0)+s.partners.reduce((a,p)=>a+p.units*p.price,0))+'<br>Aylık kira: '+tl(income)+'<br>Borç: '+tl(s.debt)+' • İşlem: '+s.deals;document.getElementById('market').innerHTML=s.market.filter(p=>!s.owned.some(o=>o.id===p.id)).map(p=>'<article>'+building(p)+'<h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>Potansiyel kira: '+tl(p.rent)+'</small><br><button '+(s.cash<p.price?'disabled':'')+' onclick="buy('+p.id+')">Satın al</button></article>').join('')||'Tüm mülkler portföyünde.';document.getElementById('portfolio').innerHTML=s.owned.map(o=>{const p=s.market.find(p=>p.id===o.id);return '<article><h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>'+(o.leased?'Kirada':'Boş')+'</small><br><button '+(!p.rent||o.leased?'disabled':'')+' onclick="lease('+p.id+')">Kirala</button><button onclick="sell('+p.id+')">Sat</button></article>'}).join('')||'Henüz mülkün yok.';document.getElementById('notice').textContent=s.notice;renderBuild();renderTasks();renderCompany();document.getElementById('office').innerHTML=s.office?'Ofis seviyesi: '+s.office+'<br>Tamamlanan müşteri işlemleri: '+s.deals+'<br>Komisyon: '+tl(12000*s.office+7000*s.staff)+'<br><button '+(s.lastDeal===s.month?'disabled':'')+' onclick="deal()">Müşteri işlemini tamamla</button><button '+(s.cash<100000*s.office||s.office>=5?'disabled':'')+' onclick="upgrade()">Ofisi büyüt ('+tl(100000*s.office)+')</button>':'Kendi ofisini aç ve her ay müşteri işlemlerinden komisyon kazan.<br><button '+(s.cash<50000?'disabled':'')+' onclick="upgrade()">Ofis aç • 50.000 TL</button>';document.getElementById('bank').innerHTML='Kalan borç: '+tl(s.debt)+'<br>Aylık faiz: %2 (oyun içi)<br><button '+(s.debt>400000?'disabled':'')+' onclick="borrow()">100.000 TL kredi</button><button '+(s.debt<=0||s.cash<=0?'disabled':'')+' onclick="repay()">50.000 TL’ye kadar öde</button>'}function renderCompany(){document.getElementById('company').innerHTML='<h3>Personel yönetimi</h3>Danışman sayısı: '+s.staff+' / '+(s.office*2)+'<br>Maaş: '+tl(s.staff*5000)+' / ay<br><button '+(!s.office||s.staff>=s.office*2||s.cash<10000?'disabled':'')+' onclick="hire()">Danışman al • 10.000 TL</button><button '+(!s.staff?'disabled':'')+' onclick="fireStaff()">Personel azalt</button>';document.getElementById('partners').innerHTML='<h3>Kat karşılığı inşaat</h3><p>Arsa sahibine 2 daire, şirketine 2 daire. Yapım maliyeti 800.000 TL, teslim 6 ay.</p><button '+(s.cash<800000||s.partners.length?'disabled':'')+' onclick="partnerBuild()">Sözleşme yap</button>'+s.partners.map(p=>'<article>Kat karşılığı proje<br><progress max="6" value="'+Math.min(6,s.month-p.start)+'"></progress><br>'+(s.month-p.start>=6?'Şirkete kalan daire: '+p.units+'<br><button onclick="partnerSell()">Daire sat • '+tl(p.price)+'</button>':'Teslime '+(6-s.month+p.start)+' ay')+'</article>').join('');document.getElementById('daily').innerHTML='<h3>Aylık faaliyet ödülü</h3>Bu ay müşteri işlemi tamamla: 5.000 TL + 10 XP<br><button '+(s.lastDeal!==s.month||s.dailyClaim===s.month?'disabled':'')+' onclick="monthlyReward()">Ödülü al</button>'}function hire(){if(!s.office||s.staff>=s.office*2||s.cash<10000)return;s.cash-=10000;s.staff++;s.notice='Danışman işe alındı.';draw()}function fireStaff(){if(!s.staff)return;s.staff--;draw()}function partnerBuild(){if(s.cash<800000||s.partners.length)return;s.cash-=800000;s.partners.push({start:s.month,units:2,price:550000});s.notice='Kat karşılığı sözleşme imzalandı.';draw()}function partnerSell(){const p=s.partners[0];if(!p||s.month-p.start<6)return;s.cash+=p.price;p.units--;if(!p.units)s.partners=[];s.notice='Şirkete ait daire satıldı.';draw()}function monthlyReward(){if(s.lastDeal!==s.month||s.dailyClaim===s.month)return;s.dailyClaim=s.month;s.cash+=5000;s.xp+=10;draw()}function missions(){return [{id:'first',name:'İlk yatırım',ok:s.owned.length>0,reward:10000},{id:'office',name:'Kendi ofisini kur',ok:s.office>0,reward:15000},{id:'deal',name:'5 müşteri işlemi tamamla',ok:s.deals>=5,reward:25000},{id:'year',name:'12. aya ulaş',ok:s.month>=12,reward:20000},{id:'build',name:'İlk inşaatını başlat',ok:s.projects.length>0,reward:40000}]}function renderTasks(){document.getElementById('news').textContent='Piyasa bülteni: '+s.news;document.getElementById('stats').innerHTML+='<hr>Seviye '+(1+Math.floor(s.xp/100))+' • '+s.xp+' XP<progress max="100" value="'+(s.xp%100)+'"></progress>';document.getElementById('tasks').innerHTML=missions().map(m=>'<div class="mission"><b>'+m.name+'</b><br>'+tl(m.reward)+' • 50 XP<br><button '+(!m.ok||s.claimed.includes(m.id)?'disabled':'')+' onclick="claim(\''+m.id+'\')">'+(s.claimed.includes(m.id)?'Alındı':'Ödülü al')+'</button></div>').join('')}function claim(id){const m=missions().find(x=>x.id===id);if(!m||!m.ok||s.claimed.includes(id))return;s.claimed.push(id);s.cash+=m.reward;s.xp+=50;s.notice='Görev ödülü alındı.';draw()}function renderBuild(){document.getElementById('city').innerHTML='<small>Şematik bölge rehberi • Gerçek coğrafi harita değildir.</small><div class="citygrid">'+s.market.map(p=>'<div class="district"><b>'+p.name.split(' • ')[0]+'</b><br>'+tl(p.price)+'<br><button onclick="tab(\'marketView\')">Piyasa</button></div>').join('')+'</div>';const lands=s.owned.filter(o=>!s.market.find(p=>p.id===o.id).rent&&!s.projects.some(p=>p.id===o.id));document.getElementById('build').innerHTML='<small>4 daireli proje • 6 ay • 800.000 TL yapım maliyeti</small>'+lands.map(o=>'<article>'+s.market.find(p=>p.id===o.id).name+'<br><button '+(s.cash<800000?'disabled':'')+' onclick="construct('+o.id+')">İnşaata başla</button></article>').join('')+s.projects.map(p=>'<article><b>'+s.market.find(x=>x.id===p.id).name+' projesi</b><br><progress max="6" value="'+Math.min(6,s.month-p.start)+'"></progress><br>'+ (s.month-p.start>=6?'Kalan daire: '+p.units+'<br><button onclick="sellUnit('+p.id+')">Daire sat • '+tl(p.unitPrice)+'</button>':'Teslime '+(6-(s.month-p.start))+' ay')+'</article>').join('')+(!lands.length&&!s.projects.length?'<p>Önce piyasadan bir arsa satın al.</p>':'')}function construct(id){if(s.cash<800000||!s.owned.some(o=>o.id===id)||s.market.find(p=>p.id===id).rent||s.projects.some(p=>p.id===id))return;s.cash-=800000;s.projects.push({id,start:s.month,units:4,unitPrice:Math.round((s.market.find(p=>p.id===id).price+800000)*1.35/4),cost:800000});s.notice='İnşaat başladı.';draw()}function sellUnit(id){const p=s.projects.find(x=>x.id===id);if(!p||s.month-p.start<6||p.units<=0)return;s.cash+=p.unitPrice;p.units--;p.cost-=200000;if(!p.units){s.projects=s.projects.filter(x=>x.id!==id);s.owned=s.owned.filter(x=>x.id!==id)}s.notice='Daire satıldı.';draw()}function tab(id){for(const x of ['marketView','portfolioView','officeView','bankView','cityView','buildView','tasksView'])document.getElementById(x).hidden=x!==id;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(id)))}function upgrade(){const cost=s.office?100000*s.office:50000;if(s.cash<cost||s.office>=5)return;s.cash-=cost;s.office++;s.notice='Ofis geliştirildi.';draw()}function deal(){if(!s.office||s.lastDeal===s.month)return;s.cash+=12000*s.office+7000*s.staff;s.deals++;s.lastDeal=s.month;s.notice='Müşteri işlemi tamamlandı.';draw()}function borrow(){if(s.debt>400000)return;s.debt+=100000;s.cash+=100000;s.notice='Kredi hesabına yatırıldı.';draw()}function repay(){const n=Math.min(50000,s.debt,Math.max(0,s.cash));s.cash-=n;s.debt-=n;s.notice='Borç ödemesi: '+tl(n);draw()}function buy(id){const p=s.market.find(p=>p.id===id);if(s.cash<p.price||s.owned.some(o=>o.id===id))return;s.cash-=p.price;s.owned.push({id,leased:false});s.notice='Mülk satın alındı.';draw()}function lease(id){const o=s.owned.find(o=>o.id===id);if(o&&s.market.find(p=>p.id===id).rent){o.leased=true;s.notice='Kiracı yerleşti.';draw()}}function sell(id){if(s.projects.some(p=>p.id===id)){s.notice='Aktif inşaat arsası satılamaz.';draw();return}if(!s.owned.some(o=>o.id===id))return;s.cash+=Math.round(s.market.find(p=>p.id===id).price*.97);s.owned=s.owned.filter(o=>o.id!==id);s.notice='Mülk satıldı. %3 işlem gideri düşüldü.';draw()}function advance(){let rent=0;for(const o of s.owned)if(o.leased)rent+=s.market.find(p=>p.id===o.id).rent;let expense=s.owned.length*500+s.office*3000+s.staff*5000+Math.round(s.debt*.02);s.cash+=rent-expense;s.month++;s.xp+=5;const trend=[{name:'Talep arttı, fiyatlar yükseliyor.',factor:1.035},{name:'Piyasa sakin, fiyatlar dengeli.',factor:1.005},{name:'Talep geriledi, fiyatlar baskı altında.',factor:.98}][Math.floor(Math.random()*3)];s.news=trend.name;for(const p of s.market)p.price=Math.round(p.price*(trend.factor-.015+Math.random()*.03));s.notice='Ay tamamlandı. Kira: '+tl(rent)+' • Gider: '+tl(expense);draw()}function resetGame(){if(confirm('Kayıt silinsin mi?')){s=fresh();migrate();draw()}}draw();</script></html>
