<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emlak İmparatorluğu</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f2e9;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{color:#dfbd77}section,article{background:#202d37;border:1px solid #40505b;border-radius:14px;padding:16px;margin:12px 0}button{background:#dfbd77;color:#101820;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}button:disabled{opacity:.4}small{color:#c4cbd0}h3{margin:4px 0}</style><main><h1>Emlak İmparatorluğu</h1><small>İSTANBUL • V0.1</small><section id="stats"></section><button onclick="advance()">Sonraki ay</button><button onclick="resetGame()">Yeni oyun</button><h2>Satılık mülkler</h2><div id="market"></div><h2>Portföyüm</h2><div id="portfolio"></div><p id="notice" role="status"></p></main><script>const base=[{id:1,name:'Esenyurt • Stüdyo',price:320000,rent:4200},{id:2,name:'Silivri • Arsa',price:450000,rent:0},{id:3,name:'Pendik • 1+1',price:480000,rent:6200},{id:4,name:'Kadıköy • 2+1',price:1800000,rent:19000}];const fresh=()=>({cash:500000,month:1,owned:[],market:base.map(p=>({...p})),notice:''});let s;try{s=JSON.parse(localStorage.getItem('emlak-v1'))||fresh()}catch(e){s=fresh()}const tl=n=>Math.round(n).toLocaleString('tr-TR')+' TL';function draw(){localStorage.setItem('emlak-v1',JSON.stringify(s));const assets=s.owned.reduce((a,o)=>a+s.market.find(p=>p.id===o.id).price,0);const income=s.owned.reduce((a,o)=>a+(o.leased?s.market.find(p=>p.id===o.id).rent:0),0);document.getElementById('stats').innerHTML='Ay '+s.month+'<h2>'+tl(s.cash)+'</h2>Nakit • Net varlık: '+tl(s.cash+assets)+'<br>Aylık kira: '+tl(income);document.getElementById('market').innerHTML=s.market.filter(p=>!s.owned.some(o=>o.id===p.id)).map(p=>'<article><h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>Potansiyel kira: '+tl(p.rent)+'</small><br><button '+(s.cash<p.price?'disabled':'')+' onclick="buy('+p.id+')">Satın al</button></article>').join('')||'Tüm mülkler portföyünde.';document.getElementById('portfolio').innerHTML=s.owned.map(o=>{const p=s.market.find(p=>p.id===o.id);return '<article><h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>'+(o.leased?'Kirada':'Boş')+'</small><br><button '+(!p.rent||o.leased?'disabled':'')+' onclick="lease('+p.id+')">Kirala</button><button onclick="sell('+p.id+')">Sat</button></article>'}).join('')||'Henüz mülkün yok.';document.getElementById('notice').textContent=s.notice}function buy(id){const p=s.market.find(p=>p.id===id);if(s.cash<p.price||s.owned.some(o=>o.id===id))return;s.cash-=p.price;s.owned.push({id,leased:false});s.notice='Mülk satın alındı.';draw()}function lease(id){const o=s.owned.find(o=>o.id===id);if(o&&s.market.find(p=>p.id===id).rent){o.leased=true;s.notice='Kiracı yerleşti.';draw()}}function sell(id){if(!s.owned.some(o=>o.id===id))return;s.cash+=Math.round(s.market.find(p=>p.id===id).price*.97);s.owned=s.owned.filter(o=>o.id!==id);s.notice='Mülk satıldı. %3 işlem gideri düşüldü.';draw()}function advance(){let rent=0;for(const o of s.owned)if(o.leased)rent+=s.market.find(p=>p.id===o.id).rent;let expense=s.owned.length*500;s.cash+=rent-expense;s.month++;for(const p of s.market)p.price=Math.round(p.price*(.97+Math.random()*.08));s.notice='Ay tamamlandı. Kira: '+tl(rent)+' • Gider: '+tl(expense);draw()}function resetGame(){if(confirm('Kayıt silinsin mi?')){s=fresh();draw()}}draw();</script></html>
