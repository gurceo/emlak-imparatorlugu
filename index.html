<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emlak İmparatorluğu</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f2e9;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{color:#dfbd77}section,article{background:#202d37;border:1px solid #40505b;border-radius:14px;padding:16px;margin:12px 0}button{background:#dfbd77;color:#101820;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}button:disabled{opacity:.4}small{color:#c4cbd0}h3{margin:4px 0}header{padding:18px 0}h1{font-size:30px;letter-spacing:-1px;margin-bottom:4px}#stats{background:linear-gradient(135deg,#33454e,#17232c)}#stats h2{font-size:34px;margin:10px 0}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{flex:1}article{border-left:3px solid #dfbd77}button{min-height:44px}#notice{position:sticky;bottom:0;background:#17232c;padding:12px;border-radius:8px} .muted{color:#b6c3cc}nav{display:grid;grid-template-columns:repeat(3,1fr)}nav button{margin:2px} .citygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.district{background:#263943;border-radius:10px;padding:12px}.building{height:110px;background:linear-gradient(#7997a8,#c6d5d8);overflow:hidden;position:relative;border-radius:8px;margin-bottom:10px}.building svg{width:100%;height:100%}progress{width:100%;accent-color:#dfbd77}</style><main><h1>Emlak İmparatorluğu</h1><small>İSTANBUL • V0.3</small><section id="stats"></section><button onclick="advance()">Sonraki ay</button><button onclick="resetGame()">Yeni oyun</button><nav><button onclick="tab('cityView')">Şehir</button><button onclick="tab('buildView')">İnşaat</button><button onclick="tab('marketView')">Piyasa</button><button onclick="tab('portfolioView')">Portföy</button><button onclick="tab('officeView')">Ofis</button><button onclick="tab('bankView')">Banka</button></nav><div id="cityView" hidden><h2>İstanbul yatırım bölgeleri</h2><section id="city"></section></div><div id="buildView" hidden><h2>İnşaat projeleri</h2><section id="build"></section></div><div id="officeView" hidden><h2>Emlak ofisi</h2><section id="office"></section></div><div id="bankView" hidden><h2>Banka</h2><section id="bank"></section></div><div id="marketView"><h2>Satılık mülkler</h2><div id="market"></div></div><div id="portfolioView" hidden><h2>Portföyüm</h2><div id="portfolio"></div></div><p id="notice" role="status"></p></main><script>const base=[{id:1,name:'Esenyurt • Stüdyo',price:320000,rent:4200},{id:2,name:'Silivri • Arsa',price:450000,rent:0},{id:3,name:'Pendik • 1+1',price:480000,rent:6200},{id:4,name:'Kadıköy • 2+1',price:1800000,rent:19000}];const fresh=()=>({cash:500000,month:1,owned:[],market:base.map(p=>({...p})),notice:'',debt:0,office:0,deals:0,lastDeal:0});let s;try{s=JSON.parse(localStorage.getItem('emlak-v1'))||fresh()}catch(e){s=fresh()}function migrate(){s.projects??=[];s.debt??=0;s.office??=0;s.deals??=0;s.lastDeal??=0;for(const p of [{id:5,name:'Beylikdüzü • 2+1',price:950000,rent:11000},{id:6,name:'Şişli • Ofis',price:2400000,rent:28000},{id:7,name:'Çatalca • Arsa',price:650000,rent:0}])if(!s.market.some(x=>x.id===p.id))s.market.push(p)}migrate();const tl=n=>Math.round(n).toLocaleString('tr-TR')+' TL';function building(p){const land=!p.rent;return '<div class="building"><svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid slice"><rect y="85" width="300" height="25" fill="#64826a"/>'+ (land?'<path d="M40 94 L130 55 L260 78 L170 108 Z" fill="#b9a17b" stroke="#f0d69d" stroke-width="3"/>':'<path d="M80 90V20L190 8V90Z" fill="#e0d8c9"/><path d="M190 8L235 30V90H190Z" fill="#929b9d"/>'+Array.from({length:12},(_,i)=>'<rect x="'+(91+i%4*24)+'" y="'+(25+Math.floor(i/4)*20)+'" width="15" height="12" fill="#425e70"/>').join(''))+'</svg></div>'}function draw(){migrate();localStorage.setItem('emlak-v1',JSON.stringify(s));const assets=s.owned.reduce((a,o)=>a+s.market.find(p=>p.id===o.id).price,0);const income=s.owned.reduce((a,o)=>a+(o.leased?s.market.find(p=>p.id===o.id).rent:0),0);document.getElementById('stats').innerHTML='Ay '+s.month+'<h2>'+tl(s.cash)+'</h2>Nakit • Net varlık: '+tl(s.cash+assets-s.debt+s.projects.reduce((a,p)=>a+p.cost,0))+'<br>Aylık kira: '+tl(income)+'<br>Borç: '+tl(s.debt)+' • İşlem: '+s.deals;document.getElementById('market').innerHTML=s.market.filter(p=>!s.owned.some(o=>o.id===p.id)).map(p=>'<article>'+building(p)+'<h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>Potansiyel kira: '+tl(p.rent)+'</small><br><button '+(s.cash<p.price?'disabled':'')+' onclick="buy('+p.id+')">Satın al</button></article>').join('')||'Tüm mülkler portföyünde.';document.getElementById('portfolio').innerHTML=s.owned.map(o=>{const p=s.market.find(p=>p.id===o.id);return '<article><h3>'+p.name+'</h3>'+tl(p.price)+'<br><small>'+(o.leased?'Kirada':'Boş')+'</small><br><button '+(!p.rent||o.leased?'disabled':'')+' onclick="lease('+p.id+')">Kirala</button><button onclick="sell('+p.id+')">Sat</button></article>'}).join('')||'Henüz mülkün yok.';document.getElementById('notice').textContent=s.notice;renderBuild();document.getElementById('office').innerHTML=s.office?'Ofis seviyesi: '+s.office+'<br>Tamamlanan müşteri işlemleri: '+s.deals+'<br>Komisyon: '+tl(12000*s.office)+'<br><button '+(s.lastDeal===s.month?'disabled':'')+' onclick="deal()">Müşteri işlemini tamamla</button><button '+(s.cash<100000*s.office||s.office>=5?'disabled':'')+' onclick="upgrade()">Ofisi büyüt ('+tl(100000*s.office)+')</button>':'Kendi ofisini aç ve her ay müşteri işlemlerinden komisyon kazan.<br><button '+(s.cash<50000?'disabled':'')+' onclick="upgrade()">Ofis aç • 50.000 TL</button>';document.getElementById('bank').innerHTML='Kalan borç: '+tl(s.debt)+'<br>Aylık faiz: %2 (oyun içi)<br><button '+(s.debt>400000?'disabled':'')+' onclick="borrow()">100.000 TL kredi</button><button '+(s.debt<=0||s.cash<=0?'disabled':'')+' onclick="repay()">50.000 TL’ye kadar öde</button>'}function renderBuild(){document.getElementById('city').innerHTML='<small>Şematik bölge rehberi • Gerçek coğrafi harita değildir.</small><div class="citygrid">'+s.market.map(p=>'<div class="district"><b>'+p.name.split(' • ')[0]+'</b><br>'+tl(p.price)+'<br><button onclick="tab(\'marketView\')">Piyasa</button></div>').join('')+'</div>';const lands=s.owned.filter(o=>!s.market.find(p=>p.id===o.id).rent&&!s.projects.some(p=>p.id===o.id));document.getElementById('build').innerHTML='<small>4 daireli proje • 6 ay • 800.000 TL yapım maliyeti</small>'+lands.map(o=>'<article>'+s.market.find(p=>p.id===o.id).name+'<br><button '+(s.cash<800000?'disabled':'')+' onclick="construct('+o.id+')">İnşaata başla</button></article>').join('')+s.projects.map(p=>'<article><b>'+s.market.find(x=>x.id===p.id).name+' projesi</b><br><progress max="6" value="'+Math.min(6,s.month-p.start)+'"></progress><br>'+ (s.month-p.start>=6?'Kalan daire: '+p.units+'<br><button onclick="sellUnit('+p.id+')">Daire sat • '+tl(p.unitPrice)+'</button>':'Teslime '+(6-(s.month-p.start))+' ay')+'</article>').join('')+(!lands.length&&!s.projects.length?'<p>Önce piyasadan bir arsa satın al.</p>':'')}function construct(id){if(s.cash<800000||!s.owned.some(o=>o.id===id)||s.market.find(p=>p.id===id).rent||s.projects.some(p=>p.id===id))return;s.cash-=800000;s.projects.push({id,start:s.month,units:4,unitPrice:Math.round((s.market.find(p=>p.id===id).price+800000)*1.35/4),cost:800000});s.notice='İnşaat başladı.';draw()}function sellUnit(id){const p=s.projects.find(x=>x.id===id);if(!p||s.month-p.start<6||p.units<=0)return;s.cash+=p.unitPrice;p.units--;p.cost-=200000;if(!p.units){s.projects=s.projects.filter(x=>x.id!==id);s.owned=s.owned.filter(x=>x.id!==id)}s.notice='Daire satıldı.';draw()}function tab(id){for(const x of ['marketView','portfolioView','officeView','bankView','cityView','buildView'])document.getElementById(x).hidden=x!==id}function upgrade(){const cost=s.office?100000*s.office:50000;if(s.cash<cost||s.office>=5)return;s.cash-=cost;s.office++;s.notice='Ofis geliştirildi.';draw()}function deal(){if(!s.office||s.lastDeal===s.month)return;s.cash+=12000*s.office;s.deals++;s.lastDeal=s.month;s.notice='Müşteri işlemi tamamlandı.';draw()}function borrow(){if(s.debt>400000)return;s.debt+=100000;s.cash+=100000;s.notice='Kredi hesabına yatırıldı.';draw()}function repay(){const n=Math.min(50000,s.debt,Math.max(0,s.cash));s.cash-=n;s.debt-=n;s.notice='Borç ödemesi: '+tl(n);draw()}function buy(id){const p=s.market.find(p=>p.id===id);if(s.cash<p.price||s.owned.some(o=>o.id===id))return;s.cash-=p.price;s.owned.push({id,leased:false});s.notice='Mülk satın alındı.';draw()}function lease(id){const o=s.owned.find(o=>o.id===id);if(o&&s.market.find(p=>p.id===id).rent){o.leased=true;s.notice='Kiracı yerleşti.';draw()}}function sell(id){if(s.projects.some(p=>p.id===id)){s.notice='Aktif inşaat arsası satılamaz.';draw();return}if(!s.owned.some(o=>o.id===id))return;s.cash+=Math.round(s.market.find(p=>p.id===id).price*.97);s.owned=s.owned.filter(o=>o.id!==id);s.notice='Mülk satıldı. %3 işlem gideri düşüldü.';draw()}function advance(){let rent=0;for(const o of s.owned)if(o.leased)rent+=s.market.find(p=>p.id===o.id).rent;let expense=s.owned.length*500+s.office*3000+Math.round(s.debt*.02);s.cash+=rent-expense;s.month++;for(const p of s.market)p.price=Math.round(p.price*(.97+Math.random()*.08));s.notice='Ay tamamlandı. Kira: '+tl(rent)+' • Gider: '+tl(expense);draw()}function resetGame(){if(confirm('Kayıt silinsin mi?')){s=fresh();migrate();draw()}}draw();</script></html>
