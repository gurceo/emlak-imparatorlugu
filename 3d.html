<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Emlak İmparatorluğu 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#182a32;color:white;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:14px;background:linear-gradient(#14232de8,transparent);pointer-events:none}#hud b{color:#f3ce83;font-size:21px}#panel{position:fixed;bottom:10px;left:12px;right:12px;background:#152631ef;border:1px solid #d2b575;border-radius:15px;padding:15px}[hidden]{display:none!important}button,a{display:inline-block;background:#e4c17d;color:#17232c;border:0;border-radius:8px;padding:12px;text-decoration:none;font-weight:bold;margin:3px}#error{position:fixed;top:40%;left:10%;right:10%;background:#17232c;padding:20px;display:none}#panel p{margin:6px 0;font-size:12px}#panel a{font-size:12px;padding:8px}#hud{background:linear-gradient(#14232df5,transparent)}#hud b{font-size:18px}#labels{position:fixed;inset:0;pointer-events:none}#labels button{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:#172a37ed;color:#fff;border:1px solid #e4c17d;font-size:11px;padding:5px 8px;white-space:nowrap;box-shadow:0 3px 8px #0005}#hud{z-index:3}#panel{z-index:4}#cash{display:inline-block;background:#172a37;border:1px solid #a98b52;border-radius:8px;padding:5px 12px;margin:5px 0}#panel:not(.selected) p{display:none}#panel:not(.selected){background:#152631b8}#panel button:disabled{opacity:.5}</style></head><body><div id="hud"><b>EMLAK İMPARATORLUĞU</b><div id="cash"></div><small>İstanbul • 3D • V1.2</small></div><div id="labels"></div><div id="panel"><strong id="name">Şirket bölgesi</strong><p id="desc">Binalara dokun. Kamerayı sürükle, iki parmakla yakınlaştır.</p><button id="upgrade" hidden>Geliştir</button><a href="classic.html">Klasik oyun</a><button id="socialopen" style="display:block;width:100%;text-align:left;background:#243746;color:white"><span style="color:#e4c17d">💬 Dünya sohbeti</span><span id="preview" style="display:block;font-size:12px;white-space:pre-line">Sohbeti aç</span></button></div><div id="socialoverlay" hidden style="position:fixed;inset:0;z-index:20;background:#101923;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px"><strong>Sosyal Dünya</strong><button id="socialclose">Şehre dön ✕</button></div><iframe id="socialframe" title="Sosyal Dünya" style="border:0;width:100%;flex:1;min-height:0"></iframe></div><div id="error">3D motor yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</div><script>const overlay=document.getElementById("socialoverlay"),frame=document.getElementById("socialframe");document.getElementById("socialopen").onclick=()=>{if(!frame.getAttribute("src"))frame.src="social.html?embedded=1&v=132";overlay.hidden=false};document.getElementById("socialclose").onclick=()=>{overlay.hidden=true};</script><script type="module">try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const db=createClient('https://zrxacsgxysfjoqwbwrud.supabase.co','sb_publishable_M_9lHNCbzKEyrsHe3-h0Ag_ZT6itiMW');async function preview(){const {data:{session}}=await db.auth.getSession();const el=document.getElementById('preview');if(!session){el.textContent='Giriş yap ve sohbete katıl';return}const {data,error}=await db.from('global_messages').select('sender_id,body').order('created_at',{ascending:false}).limit(2);if(error)return;const ids=[...new Set(data.map(m=>m.sender_id))];const p=ids.length?await db.from('profiles').select('id,username').in('id',ids):{data:[]};const names=new Map((p.data||[]).map(x=>[x.id,x.username]));el.textContent=data.reverse().map(m=>(names.get(m.sender_id)||'Oyuncu')+': '+m.body.slice(0,65)).join('\n')||'İlk mesajı sen gönder'}await preview();setInterval(()=>preview().catch(()=>{}),12000)}catch{}</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">try{const T=await import("three");const {OrbitControls}=await import("three/addons/controls/OrbitControls.js");const scene=new T.Scene();scene.background=new T.Color(0x789260);scene.fog=new T.Fog(0x789260,110,200);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,220);camera.position.set(30,78,40);const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,4);controls.enableDamping=true;controls.minDistance=18;controls.maxDistance=95;controls.maxPolarAngle=Math.PI*.36;scene.add(new T.HemisphereLight(0xffffff,0x66744b,2));const sun=new T.DirectionalLight(0xffe5c4,3);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40});scene.add(sun);const mats={};function mat(c){return mats[c]??=new T.MeshStandardMaterial({color:c,roughness:.78})}function box(w,h,d,x,y,z,c,parent=scene){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}box(180,.5,180,0,-.3,0,0x789260);for(const z of [-14,0,14]){box(65,.08,5,0,0,z,0x555d63);for(let x=-30;x<31;x+=5)box(2,.02,.12,x,.06,z,0xe9d6a3)}box(5,.09,65,0,0,0,0x555d63);for(let z=-30;z<31;z+=5)box(.12,.02,2,0,.07,z,0xe9d6a3);let state;try{state=JSON.parse(localStorage.getItem('emlak3d'))}catch{}state={cash:typeof state?.cash==='number'&&Number.isFinite(state.cash)?state.cash:500000,levels:Array.from({length:5},(_,i)=>Number.isInteger(state?.levels?.[i])&&state.levels[i]>=1&&state.levels[i]<=10?state.levels[i]:1)};try{localStorage.setItem('emlak3d',JSON.stringify(state))}catch{}const specs=[['Şirket merkezi',-10,-8,8,7,0xd8d3c7],['Emlak ofisi',10,-8,7,4,0xe5d8c2],['Finans merkezi',-10,8,7,5,0xb8c8ce],['İnşaat merkezi',10,8,8,3,0xd1a47d],['Yatırım merkezi',10,22,7,5,0xd8d3c7]];const groups=[];const labels=[];function build(i){const [name,x,z,w,h,c]=specs[i];const g=new T.Group();g.position.set(x,0,z);g.userData.index=i;scene.add(g);groups[i]=g;const height=h+(state.levels[i]-1)*1.1;box(w+2,.25,w+2,0,.1,0,0xbcb9aa,g);box(w,height,w,0,height/2+.25,0,c,g);box(w+.3,.3,w+.3,0,height+.4,0,0x39454c,g);for(let y=1.2;y<height;y+=1.25)for(let k=-w/2+.8;k<w/2-.3;k+=1.3){box(.85,.75,.06,k,y,w/2+.04,0x345a70,g);box(.06,.75,.85,w/2+.04,y,k,0x345a70,g);box(.85,.75,.06,k,y,-w/2-.04,0x345a70,g);box(.06,.75,.85,-w/2-.04,y,k,0x345a70,g)}for(let y=2.3;y<height;y+=2.5){if(i!==3){for(const side of [-1,1]){box(w*.83,.13,.75,0,y,side*(w/2+.3),0xdad8ce,g);box(w*.83,.4,.06,0,y+.25,side*(w/2+.65),0x7299aa,g);box(.75,.13,w*.83,side*(w/2+.3),y,0,0xdad8ce,g);box(.06,.4,w*.83,side*(w/2+.65),y+.25,0,0x7299aa,g)}}}box(w*.35,.55,w*.25,0,height+.7,0,0x9ba3a3,g);box(1.5,1.8,.15,0,1,w/2+.12,0x203b4b,g);box(2.8,.18,1.4,0,2,w/2+.65,0x555d63,g);if(i===0){box(w*.65,height*.55,w*.65,0,height*1.275+.25,0,0x9caeb8,g);box(w*.7,.25,w*.7,0,height*1.55+.4,0,0x34454e,g);for(let y=height+.8;y<height*1.55;y+=.9){for(const side of [-1,1]){box(w*.62,.45,.07,0,y,side*(w*.325+.04),0x355d75,g);box(.07,.45,w*.62,side*(w*.325+.04),y,0,0x355d75,g)}}}if(i===1){for(let k=-2;k<=2;k+=2)box(1.5,1.6,.08,k,1,w/2+.08,0x416e85,g)}if(i===2){for(let k=-2.5;k<=2.5;k+=1.25)box(.35,height,.4,k,height/2,w/2+.3,0xe4dfd2,g)}if(i===3){box(.35,9,.35,3,4.5,-3,0xe3b23c,g);box(8,.25,.35,1,9,-3,0xe3b23c,g);box(.05,3,.05,-2,7.5,-3,0x343b40,g)}if(i===4){box(w*.75,.15,2,0,.2,w/2+2,0x469db8,g)}return g}specs.forEach((_,i)=>build(i));for(let i=0;i<44;i++){const x=(i%2?1:-1)*(18+((i*13)%13)),z=-31+(i*7)%62;box(.25,1.6,.25,x,.8,z,0x69513c);const m=new T.Mesh(new T.SphereGeometry(.85,8,6),mat(0x416b3b));m.position.set(x,2,z);m.castShadow=true;scene.add(m)}for(const x of [-10,10])for(const z of [-20,19]){box(7,.08,5,x,.02,z,0x777c7e);for(let k=-2.5;k<=2.5;k+=1.25)box(.06,.02,4,x+k,.08,z,0xece9db)}for(let i=0;i<12;i++){const x=-15+i*2.6;box(.12,2.8,.12,x,1.4,-11,0x48555a);box(.55,.16,.3,x,2.8,-11,0xf4e8c2)}const people=[];for(let i=0;i<8;i++){const g=new T.Group();box(.32,.65,.23,0,.65,0,[0x244d75,0xa46a45,0xeeeeee][i%3],g);const head=new T.Mesh(new T.SphereGeometry(.16,8,6),mat(0xc99a78));head.position.y=1.13;g.add(head);box(.12,.35,.15,-.09,.18,0,0x29343d,g);box(.12,.35,.15,.09,.18,0,0x29343d,g);scene.add(g);people.push(g)}const cars=[];for(let i=0;i<6;i++){const g=new T.Group();box(1.7,.45,.85,0,.35,0,[0x9e3e38,0xeeeeee,0x244b73][i%3],g);box(.85,.35,.72,0,.7,0,0x385263,g);scene.add(g);cars.push(g)}let selected=-1;const labelRoot=document.getElementById('labels');specs.forEach((spec,i)=>{const b=document.createElement('button');b.onclick=()=>{selected=i;ui()};labelRoot.append(b);labels.push(b)});const cash=document.getElementById('cash'),nameEl=document.getElementById('name'),desc=document.getElementById('desc'),up=document.getElementById('upgrade');function ui(){labels.forEach((b,i)=>b.textContent=specs[i][0]+' · '+state.levels[i]);document.getElementById('panel').classList.toggle('selected',selected>=0);cash.textContent=state.cash.toLocaleString('tr-TR')+' TL';if(selected>=0){nameEl.textContent=specs[selected][0]+' • Seviye '+state.levels[selected];desc.textContent='Binayı yükselt ve şirket bölgeni büyüt.';up.hidden=false;up.textContent='Geliştir • '+(state.levels[selected]*50000).toLocaleString('tr-TR')+' TL';up.disabled=state.cash<state.levels[selected]*50000||state.levels[selected]>=10}}up.onclick=()=>{const cost=state.levels[selected]*50000;if(state.cash<cost||state.levels[selected]>=10)return;state.cash-=cost;state.levels[selected]++;scene.remove(groups[selected]);build(selected);try{localStorage.setItem('emlak3d',JSON.stringify(state))}catch{}ui()};ui();const ray=new T.Raycaster(),p=new T.Vector2();let start;renderer.domElement.addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY]});renderer.domElement.addEventListener('pointerup',e=>{if(!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>8)return;p.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(p,camera);const hits=ray.intersectObjects(groups,true);if(hits.length){let o=hits[0].object;while(o&&o.userData.index===undefined)o=o.parent;if(o){selected=o.userData.index;ui()}}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(t=>{cars.forEach((g,i)=>{g.position.set(((t*.003+i*11)%62)-31,.05,[-14,0,14][i%3]+(i%2?1:-1));g.rotation.y=i%2?Math.PI:0});people.forEach((g,i)=>{g.position.set(-16+((t*.001+i*4)%32),.05,[-10.5,10.5][i%2]);g.rotation.y=Math.PI/2});controls.update();camera.updateMatrixWorld();labels.forEach((b,i)=>{const spec=specs[i];const v=new T.Vector3(spec[1],spec[4]+(state.levels[i]-1)*1.1+(i===0?spec[4]*.55:0)+1.5,spec[2]).project(camera);b.style.left=((v.x+1)*innerWidth/2)+'px';b.style.top=((1-v.y)*innerHeight/2)+'px';b.style.display=v.z>1||Math.abs(v.x)>.95||Math.abs(v.y)>.85?'none':'block'});renderer.render(scene,camera)});}catch(e){const el=document.getElementById('error');el.style.display='block';el.textContent='3D başlatma hatası: '+e.message;console.error(e)}</script><script>window.addEventListener('error',()=>{if(!document.querySelector('canvas'))document.getElementById('error').style.display='block'},true)</script></body></html>
