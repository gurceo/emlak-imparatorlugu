<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Emlak İmparatorluğu 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#182a32;color:white;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:14px;background:linear-gradient(#14232de8,transparent);pointer-events:none}#hud b{color:#f3ce83;font-size:21px}#panel{position:fixed;bottom:18px;left:12px;right:12px;background:#152631ef;border:1px solid #d2b575;border-radius:15px;padding:15px}[hidden]{display:none!important}button,a{display:inline-block;background:#e4c17d;color:#17232c;border:0;border-radius:8px;padding:12px;text-decoration:none;font-weight:bold;margin:3px}#error{position:fixed;top:40%;left:10%;right:10%;background:#17232c;padding:20px;display:none}</style></head><body><div id="hud"><b>EMLAK İMPARATORLUĞU</b><div id="cash"></div><small>İstanbul • 3D prototip</small></div><div id="panel"><strong id="name">Şirket bölgesi</strong><p id="desc">Binalara dokun. Kamerayı sürükle, iki parmakla yakınlaştır.</p><button id="upgrade" hidden>Geliştir</button><a href="classic.html">Klasik oyun</a></div><div id="error">3D motor yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">try{const T=await import("three");const {OrbitControls}=await import("three/addons/controls/OrbitControls.js");const scene=new T.Scene();scene.background=new T.Color(0x9eb9c6);scene.fog=new T.Fog(0x9eb9c6,75,170);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,220);camera.position.set(35,43,48);const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.minDistance=18;controls.maxDistance=95;controls.maxPolarAngle=Math.PI*.46;scene.add(new T.HemisphereLight(0xffffff,0x66744b,2));const sun=new T.DirectionalLight(0xffe5c4,3);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40});scene.add(sun);const mats={};function mat(c){return mats[c]??=new T.MeshStandardMaterial({color:c,roughness:.78})}function box(w,h,d,x,y,z,c,parent=scene){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}box(90,.5,90,0,-.3,0,0x789260);for(const z of [-14,0,14]){box(65,.08,5,0,0,z,0x555d63);for(let x=-30;x<31;x+=5)box(2,.02,.12,x,.06,z,0xe9d6a3)}box(5,.09,65,0,0,0,0x555d63);for(let z=-30;z<31;z+=5)box(.12,.02,2,0,.07,z,0xe9d6a3);let state;try{state=JSON.parse(localStorage.getItem('emlak3d'))}catch{}state??={cash:500000,levels:[1,1,1,1,1]};const specs=[['Şirket merkezi',-10,-8,8,7,0xd8d3c7],['Emlak ofisi',10,-8,7,4,0xe5d8c2],['Finans merkezi',-10,8,7,5,0xb8c8ce],['İnşaat merkezi',10,8,8,3,0xd1a47d],['Yatırım merkezi',10,22,7,5,0xd8d3c7]];const groups=[];function build(i){const [name,x,z,w,h,c]=specs[i];const g=new T.Group();g.position.set(x,0,z);g.userData.index=i;scene.add(g);groups[i]=g;const height=h+(state.levels[i]-1)*1.1;box(w+2,.25,w+2,0,.1,0,0xbcb9aa,g);box(w,height,w,0,height/2+.25,0,c,g);box(w+.3,.3,w+.3,0,height+.4,0,0x39454c,g);for(let y=1.2;y<height;y+=1.25)for(let k=-w/2+.8;k<w/2-.3;k+=1.3){box(.85,.75,.06,k,y,w/2+.04,0x345a70,g);box(.06,.75,.85,w/2+.04,y,k,0x345a70,g)}box(1.5,1.8,.15,0,1,w/2+.12,0x203b4b,g);box(2.8,.18,1.4,0,2,w/2+.65,0x555d63,g);return g}specs.forEach((_,i)=>build(i));for(let i=0;i<44;i++){const x=(i%2?1:-1)*(18+((i*13)%13)),z=-31+(i*7)%62;box(.25,1.6,.25,x,.8,z,0x69513c);const m=new T.Mesh(new T.SphereGeometry(.85,8,6),mat(0x416b3b));m.position.set(x,2,z);m.castShadow=true;scene.add(m)}const cars=[];for(let i=0;i<6;i++){const g=new T.Group();box(1.7,.45,.85,0,.35,0,[0x9e3e38,0xeeeeee,0x244b73][i%3],g);box(.85,.35,.72,0,.7,0,0x385263,g);scene.add(g);cars.push(g)}let selected=-1;const cash=document.getElementById('cash'),nameEl=document.getElementById('name'),desc=document.getElementById('desc'),up=document.getElementById('upgrade');function ui(){cash.textContent=state.cash.toLocaleString('tr-TR')+' TL';if(selected>=0){nameEl.textContent=specs[selected][0]+' • Seviye '+state.levels[selected];desc.textContent='Binayı yükselt ve şirket bölgeni büyüt.';up.hidden=false;up.textContent='Geliştir • '+(state.levels[selected]*50000).toLocaleString('tr-TR')+' TL';up.disabled=state.cash<state.levels[selected]*50000||state.levels[selected]>=10}}up.onclick=()=>{const cost=state.levels[selected]*50000;if(state.cash<cost||state.levels[selected]>=10)return;state.cash-=cost;state.levels[selected]++;scene.remove(groups[selected]);build(selected);localStorage.setItem('emlak3d',JSON.stringify(state));ui()};ui();const ray=new T.Raycaster(),p=new T.Vector2();let start;renderer.domElement.addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY]});renderer.domElement.addEventListener('pointerup',e=>{if(!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>8)return;p.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(p,camera);const hits=ray.intersectObjects(groups,true);if(hits.length){let o=hits[0].object;while(o&&o.userData.index===undefined)o=o.parent;if(o){selected=o.userData.index;ui()}}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(t=>{cars.forEach((g,i)=>{g.position.set(((t*.003+i*11)%62)-31,.05,[-14,0,14][i%3]+(i%2?1:-1));g.rotation.y=i%2?Math.PI:0});controls.update();renderer.render(scene,camera)});}catch(e){const el=document.getElementById('error');el.style.display='block';el.textContent='3D başlatma hatası: '+e.message;console.error(e)}</script><script>window.addEventListener('error',()=>{if(!document.querySelector('canvas'))document.getElementById('error').style.display='block'},true)</script></body></html>
